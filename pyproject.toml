[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-marketing-kb"
version = "0.1.0"
description = "Vendor-neutral marketing knowledge with structural entity resolution and evidence-aware retrieval"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes>=3"]
st = ["sentence-transformers>=2.2"]

[project.scripts]
smkb = "semantic_marketing_kb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
